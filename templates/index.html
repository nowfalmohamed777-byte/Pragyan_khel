<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Video/Image Temporal Error Detector</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 40px; }
      .box { border: 1px solid #ccc; padding: 20px; border-radius: 6px; max-width: 700px }
    </style>
  </head>
  <body>
    <h1>Upload image or video</h1>
    <div class="box">
      <form action="/analyze" method="post" enctype="multipart/form-data">
        <p>
          <input type="file" name="file" required />
        </p>
        <p>
          <button type="submit">Upload & Analyze</button>
        </p>
      </form>
      <p>Supported images: PNG, JPG. Supported video: MP4, MOV, AVI.</p>
    </div>
  </body>
</html>
